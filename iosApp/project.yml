name: DeepSeek
options:
  bundleIdPrefix: com.deepseek.client
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEEPSEEK_ROOT: $(SRCROOT)/../..
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(DEEPSEEK_ROOT)/.tmp/build/shared/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: $(inherited) -framework DeepSeekShared -lsqlite3
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: DeepSeek Client
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  DeepSeek:
    type: application
    platform: iOS
    sources:
      - path: DeepSeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek.client.native
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
    preBuildScripts:
      - name: Build shared KMP framework
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$DEEPSEEK_ROOT"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
schemes:
  DeepSeek:
    build:
      targets:
        DeepSeek: all
    run:
      config: Debug
